<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mazdor - Service Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <!-- Navbar -->
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <h1 class="text-2xl font-bold text-blue-600">Mazdor</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <button class="text-gray-600 hover:text-gray-900">Services</button>
                    <button class="text-gray-600 hover:text-gray-900">Profiles</button>
                    <button class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Login</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="bg-gradient-to-r from-blue-600 to-purple-600 text-white py-20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <h2 class="text-4xl font-bold mb-4">Find Local Services</h2>
            <p class="text-xl mb-8">Connect with trusted service providers in your area</p>
            
            <!-- Search Bar -->
            <div class="max-w-2xl mx-auto">
                <div class="flex">
                    <input type="text" id="searchInput" placeholder="Search for services..." 
                           class="flex-1 px-4 py-3 rounded-l-lg text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button onclick="searchServices()" 
                            class="bg-white text-blue-600 px-6 py-3 rounded-r-lg font-semibold hover:bg-gray-100">
                        Search
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- Services Section -->
    <section class="py-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <h3 class="text-2xl font-bold text-center mb-12">Popular Services</h3>
            
            <div id="servicesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- Services will be loaded here -->
            </div>
        </div>
    </section>

    <!-- Profiles Section -->
    <section class="py-16 bg-white">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <h3 class="text-2xl font-bold text-center mb-12">Featured Service Providers</h3>
            
            <div id="profilesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- Profiles will be loaded here -->
            </div>
        </div>
    </section>

    <script>
        // Sample data - in real app this would come from API
        const sampleServices = [
            { id: 1, name: 'Plumbing', svg: '🔧', view_box: '0 0 24 24' },
            { id: 2, name: 'Electrical', svg: '⚡', view_box: '0 0 24 24' },
            { id: 3, name: 'Cleaning', svg: '🧹', view_box: '0 0 24 24' }
        ];

        const sampleProfiles = [
            {
                id: 'uuid-1',
                title: 'Professional Plumber',
                min_price: 50.00,
                description: 'Experienced plumber with 10+ years of service',
                service_type: 'both',
                user: { name: 'John Doe', avatar: 'https://picsum.photos/100/100?random=1' },
                service: { name: 'Plumbing', svg: '🔧' }
            },
            {
                id: 'uuid-2',
                title: 'Expert Electrician',
                min_price: 75.00,
                description: 'Licensed electrician specializing in residential work',
                service_type: 'homeOnly',
                user: { name: 'Jane Smith', avatar: 'https://picsum.photos/100/100?random=2' },
                service: { name: 'Electrical', svg: '⚡' }
            }
        ];

        // Load services
        function loadServices() {
            const grid = document.getElementById('servicesGrid');
            grid.innerHTML = sampleServices.map(service => `
                <div class="bg-white p-6 rounded-lg shadow-md hover:shadow-lg transition-shadow cursor-pointer">
                    <div class="text-4xl mb-4 text-center">${service.svg}</div>
                    <h4 class="text-lg font-semibold text-center">${service.name}</h4>
                </div>
            `).join('');
        }

        // Load profiles
        function loadProfiles() {
            const grid = document.getElementById('profilesGrid');
            grid.innerHTML = sampleProfiles.map(profile => `
                <div class="bg-white p-6 rounded-lg shadow-md hover:shadow-lg transition-shadow">
                    <div class="flex items-center mb-4">
                        <img src="${profile.user.avatar}" alt="${profile.user.name}" 
                             class="w-12 h-12 rounded-full mr-3">
                        <div>
                            <h4 class="font-semibold">${profile.user.name}</h4>
                            <p class="text-sm text-gray-600">${profile.title}</p>
                        </div>
                    </div>
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-2xl mr-2">${profile.service.svg}</span>
                        <span class="text-lg font-bold text-green-600">$${profile.min_price}/hr</span>
                    </div>
                    <p class="text-gray-600 text-sm">${profile.description}</p>
                    <div class="mt-3">
                        <span class="inline-block bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded">
                            ${profile.service_type}
                        </span>
                    </div>
                </div>
            `).join('');
        }

        // Search functionality
        function searchServices() {
            const searchTerm = document.getElementById('searchInput').value;
            alert(`Searching for: ${searchTerm}`);
            // In real app, this would call the API
        }

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            loadServices();
            loadProfiles();
        });
    </script>
</body>
</html>
